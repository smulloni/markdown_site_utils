[project]
name = "markdown-site-utils"
version = "0.2.2"
description = "Some utilities for managing Markdown files with metadata."
authors = [{ name = "Jacob Smullyan", email = "smulloni@smullyan.org" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "MarkupSafe>=2.1.2",
    "PyYAML>=6.0",
    "markdown2>=2.5.1",
    "toml>=0.10.2",
]

[project.urls]
Repository = "https://github.com/smulloni/markdown_site_utils"

[dependency-groups]
dev = [
    "pytest>=7.3.0",
    "ipython>=8.12.0",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mdsite"
module-root = ""

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, pyupgrade, bugbear
select = ["F", "E", "W", "I", "UP", "B"]
